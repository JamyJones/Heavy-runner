name: RUN HEAVY PARALLEL PROCESS

on:
  workflow_dispatch:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout private tools
        uses: actions/checkout@v4
        with:
          repository: john4650-hub/Hello-Android-CI
          token: ${{ secrets.TK }}

      - name: generate matrix for process
        id: generate
        run: |
          IFS=" " read -r input_count file_label <<< $(wc matrix_input.txt -l)
          MATRIX=$(seq 0 $((input_count - 1)) | jq -c '[inputs]')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
        shell: bash

  proccess-json-data:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chunk_id: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: john4650-hub/Hello-Android-CI
          token: ${{ secrets.TK }}

      - name: Install ffmpeg
        uses: animMouse/setup-ffmpeg@v1

      - name: PROCESS MATRIX
        run: |
          chmod +x scripts/*.sh
          ./scripts/matrix.sh ${{ matrix.chunk_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.TK }}
        shell: bash
