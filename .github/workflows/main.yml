name: Run browser
on:
  workflow_dispatch:
jobs:
  Work-time:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private tools
        uses: actions/checkout@v4
        with:
          repository: john4650-hub/Hello-Android-CI
          token: ${{ secrets.TK }}
      - run: |
         sudo apt-get install -y chromium-browser
      - uses: nanasess/setup-chromedriver@v3
     - name: Run-auto-browser
       uses: coactions/setup-xvfb@v1
       with:
         run: |
           chmod +x run_browser.sh
           ./run_browser.sh 0.${{ github.run_number }}.0 $GITHUB_TOKEN >> ${{ github.workspace }}/log.txt 2>&1 || true
       env:
         GITHUB_TOKEN: ${{ secrets.TK }}
      - name: commit logs
        run: |
          mkdir -p log/Pastebin
          gh repo clone John4650-hub/Pastebin log/Pastebin
          cp ${{ github.workspace }}/log.txt log/Pastebin/
          cd log/Pastebin
          git config --global user.name "$GIT_USERNAME"
          git config --global user.email "$GIT_AUTHOR_EMAIL"
          git add .
          git commit -m "logs from building react app"
        env:
          GITHUB_TOKEN: ${{ secrets.TK }}
          GIT_AUTHOR_EMAIL: johndelvin51@gmail.com
          GIT_USERNAME: john4650-hub 
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.TK }}
          repository: john4650-hub/Pastebin
          directory: log/Pastebin

